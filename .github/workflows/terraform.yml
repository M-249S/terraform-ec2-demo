name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt-and-validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.0"

      - name: Check formatting
        run: terraform fmt -check -recursive

      # No AWS credentials needed here: -backend=false skips remote state,
      # and validate only checks syntax/types, never talks to AWS.
      - name: Init (no backend, no credentials needed)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  iac-security-scan:
    name: IaC Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: fmt-and-validate
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned to the full commit SHA of trivy-action v0.35.0, the release that
      # stayed safe after the March 2026 compromise of trivy-action tags
      # (GHSA-69fq-xp46-6x23). Never reference this action by a tag or branch.
      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
